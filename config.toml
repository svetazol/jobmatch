# Choices only. hh's ceiling, fetch rate, result ordering and the queries that
# cover a country are hh's, in jobmatch/sources/hh/ --
# `python -m jobmatch.sources.hh russia` prints what a country name expands to.

model = "jev-1.13"        # pinned, never an alias: part of the match fingerprint
cv_path = "data/cv3.md"   # the CV the next match run uses

# What the market view reports on: the CV *already* matched, not cv_path.
# 2026-09-29: cv2 holds all 2 720 current matches, cv3 none. `jobmatch cv-hash`.
stats_cv_hash = "9e5bbcb28e19493e48b23ef128359014dc4fbbc38153d6261693d76225e1f4a5"

# Opaque, passed to hh verbatim. excluded_text is matched against search_field,
# so it also drops a posting whose *description* is QA or devops work; quoted
# terms are exact phrases. No work_format filter: vacancies.work_formats records
# what each posting offers, so that filtering happens after the fact.
[sources."hh.ru".search]
text = "python"
excluded_text = '"QA","AQA",тестировщик,devops'
search_field = ["name", "description"]

# `run --only bg` crawls one sweep; bare `run` crawls all. One search per source,
# so two sweeps cannot drift apart.
[sources."hh.ru".sweeps]
bg = ["belarus", "georgia"]
ru = ["russia"]
