# Choices only. hh's ceiling, fetch rate, result ordering and the queries that
# cover a country are hh's, in jobmatch/sources/hh/ --
# `python -m jobmatch.sources.hh russia` prints what a country name expands to.

cv_path = "data/cv2.md"   # the CV the next match run uses

experience_years = 5      # the user's years, against each posting's hh experience bucket

# What the market view reports on: the CV *already* matched, not cv_path.
# cv2, the same as cv_path; they diverge only while a new CV is being matched.
# 2026-10-15: cv2 holds all 6 742 current matches. `jobmatch cv-hash`.
stats_cv_hash = "db2146a581843eae4a31e534e15ca1eb962b624af6c43f1b22580e44c3e57e14"

# One model per kind of call, keyed as `llm_calls.kind` names it. Each is pinned,
# never an alias: it is part of that call's fingerprint.
[models]
match = "jev-1.13"
# Who is behind a posting (`jobmatch identify`). Provisional until the employer
# eval picks it (docs/company-research.md, build step 3).
employer = "google/gemini-2.5-flash-lite"
# Who recruits for a company (`jobmatch recruiters`). The `:online` suffix turns
# on OpenRouter's web search for the call; unverified until the first real clicks
# (docs/company-research.md §3). Perplexity's sonar is the alternative.
recruiters = "google/gemini-2.5-flash-lite:online"
# The cover note, through the user's own `claude -p`.
cover_note = "claude-sonnet-5-5"

# Opaque, passed to hh verbatim. excluded_text is matched against search_field,
# so it also drops a posting whose *description* is QA or devops work; quoted
# terms are exact phrases. No work_format filter: vacancies.work_formats records
# what each posting offers, so that filtering happens after the fact.
[sources."hh.ru".search]
text = "python"
excluded_text = '"QA","AQA",тестировщик,devops'
search_field = ["name", "description"]

# `run --only bg` crawls one sweep; bare `run` crawls all. One search per source,
# so two sweeps cannot drift apart.
[sources."hh.ru".sweeps]
bg = ["belarus", "georgia"]
ru = ["russia"]
