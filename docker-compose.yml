services:
  db:
    image: postgres:18-alpine
    container_name: jobmatch-postgres
    environment:
      POSTGRES_USER: jobmatch
      POSTGRES_PASSWORD: jobmatch
      POSTGRES_DB: jobmatch
    # 5433 on the host: 5432 is taken by another project's container
    ports: ["5433:5432"]
    # PG18 wants the parent dir mounted, not .../data
    volumes: ["pgdata:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobmatch -d jobmatch"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
