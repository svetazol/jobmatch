[project]
name = "cv"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.3",
    "psycopg[binary]>=3.3.6",
    "python-dotenv",
    "requests>=2.34.2",
    "sqlalchemy>=2.0.54",
    "typesafe-sdk>=0.7.1",
]

[project.scripts]
jobmatch = "jobmatch.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jobmatch"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
